# 策略注册表：每条目对应一个策略脚本。
# 新增策略：在 strategies/ 下新建脚本（定义 Strategy 类，继承 base.BaseStrategy），
# 然后在此登记 name / script / params 即可，无需改动引擎代码。
strategies:
  - name: ma_golden_cross
    enabled: false
    script: strategies/ma_golden_cross.py
    params:
      short: 5
      long: 20
      vol_ratio: 1.2
      holding: 5

  - name: volume_breakout
    enabled: true
    script: strategies/volume_breakout.py
    params:
      n: 20
      vol_ratio: 1.5
      holding: 5

  # ---- 分位筛选（基础）----
  - name: quantile_range
    enabled: false
    script: strategies/quantile_range.py
    params:
      window: 60
      quantile_low: 0.25
      quantile_high: 0.50
      holding: 5

  # ---- 分位筛选 + 均线（在 quantile_range 基础上进一步判断）----
  - name: quantile_ma
    enabled: false
    script: strategies/quantile_ma.py
    params:
      window: 60
      quantile_low: 0.25
      quantile_high: 0.50
      ma_short: 5
      ma_long: 20
      holding: 5

  # ---- 分位筛选 + 量能 t 检验（在 quantile_range 基础上判断量能显著放大）----
  - name: quantile_volume
    enabled: false
    script: strategies/quantile_volume.py
    params:
      window: 60
      recent_days: 10
      significance: 0.01
      quantile_low: 0.25
      quantile_high: 0.50
      holding: 5

  # ---- 均线粘合 + 放量突破 ----
  - name: ma_breakout
    enabled: false
    script: strategies/ma_breakout.py
    params:
      ma_short: 5
      ma_mid: 10
      ma_long: 20
      converge_pct: 0.03
      breakout_pct: 0.05
      min_turn: 10.0
      holding: 5

  # ---- ma_breakout 信号延迟5日入场（对比用）----
  - name: ma_breakout_shift5
    enabled: true
    script: strategies/ma_breakout_shift.py
    params:
      shift: 5
      ma_short: 5
      ma_mid: 10
      ma_long: 20
      converge_pct: 0.03
      breakout_pct: 0.05
      min_turn: 10.0
      holding: 5

  # ---- B1 稳健超跌型（同花顺远航版公式移植）----
  - name: b1_oversold
    enabled: true
    script: strategies/b1_oversold.py
    params:
      rsi_period: 6
      rsi_max: 20.0
      amp_min: 8.0          # CORE1 当日振幅下限(%)
      amp_canbuy: 1.0       # CANBUY 当日振幅下限(%)
      price_min: 20.0       # 收盘价下限（<=0 不启用）；用当前复权价
      lu_window: 20         # 近 N 日无涨停
      rmax_window: 60       # RMAX 窗口（排除 5% 涨跌幅限制的 ST 股）
      zt_main: 1.095
      zt_gem: 1.195
      boards: "60,00,30"    # 仅主板/创业板，排除科创北交
      exclude_st: true
      min_listed_bars: 250  # 上市满 N 个交易日（0 不校验）
      require_market_down: true
      market_index: "399317"
      min_bars: 65
      holding: 5

  # ---- 均线单次金叉突破 + 低波动 + 动量爆发 ----
  - name: ma_cross_breakout
    enabled: false
    script: strategies/ma_cross_breakout.py
    params:
      lookback: 80
      surge_days: 2
      surge_pct: 0.05
      turn_ma: 10
      turn_ratio: 1.3
      boll_ma: 20
      boll_k: 3.0
      vol_ratio_max: 0.26
      # 波动窗口前用 MA5 连续下降修剪：跳过窗口头部下跌段，从停止下降处起算波动率
      trim_decline: true
      min_vol_days: 10
      cross_ma_short: 5
      cross_ma_mid: 10
      cross_ma_long: 20
      cross_ma_base: 60
      holding: 5

  # ---- 趋势缩量回调 + 资金流入（13 条条件筛选）----
  # 主力资金净流入：baostock 无个股资金流数据，用「收盘日内位置 × 放量倍数」量价代理
  # 流通市值：用 volume / (turn/100) × close 反推（实测反推股本变异系数 <0.05%）
  - name: trend_pullback_inflow
    enabled: false
    script: strategies/trend_pullback_inflow.py
    params:
      ma_long: 20           # 收盘价站上该均线
      ma_trend: 20          # 该均线向上（今日 > 昨日）
      ma_short: 5           # 短期均线
      ma_mid: 10            # 中期均线，要求 ma_short > ma_mid
      max_pct_chg: 6.0      # 当日涨幅上限(%)
      vol_shrink_window: 5  # 当日量 < 前 N 日均量
      vol_max_window: 20    # 当日量 < 前 N 日最大量
      inflow_window: 3      # 资金流入代理的近 N 日求和窗口
      turn_min: 3.0         # 换手率下限(%)
      turn_max: 12.0        # 换手率上限(%)
      range_window: 20      # 区间涨跌幅窗口
      range_max: 35.0       # 区间涨跌幅上限(±%)
      bias_window: 60       # 乖离率窗口
      bias_max: 25.0        # 乖离率上限(±%)
      float_mv_min: 30.0    # 流通市值下限(亿元)
      float_mv_max: 600.0   # 流通市值上限(亿元)
      amount_window: 20     # 日均成交额窗口
      amount_min: 1.0       # 日均成交额下限(亿元)
      min_listed_days: 180  # 上市天数下限
      min_bars: 65
      holding: 5

  # ---- 连续5日收阳 + 5日累计涨幅>20%（动量加速）----
  - name: consecutive_up5
    enabled: true
    script: strategies/consecutive_up5.py
    params:
      window: 5             # 连续上涨天数与累计涨幅窗口
      min_gain_pct: 20.0    # 窗口内累计涨幅下限(%)
      exclude_st: true      # 剔除 ST / 退市
      min_listed_days: 180  # 上市天数下限（自然日，0 不校验）
      exclude_boards: "688" # 剔除板块前缀（科创板）
      min_bars: 65
      holding: 5

  # ---- 上升趋势中的缩量阴线回调（起涨前夜型，来源：docs/起涨点前兆分析报告.md 的候选信号检验）----
  # 注意：检验时的条件是在「站上 MA20 且 MA20 向上」之内成立的，故策略必须带上该位置约束
  - name: ma20_pullback_shrink
    enabled: true
    script: strategies/ma20_pullback_shrink.py
    params:
      ma_long: 20           # 趋势基准均线
      pct_max: -2.61        # 当日涨跌幅上限(%)，≤该值才入选
      vol_ratio_max: 0.90   # 量比上限（量 / 前 N 日均量）
      vol_ma_window: 5      # 量比所用均量窗口
      vol_include_today: true  # 均量含当日（与分析脚本口径一致；false 为A股常规量比）
      exclude_st: true
      exclude_boards: "688"
      min_listed_days: 180
      min_bars: 20          # 只需 MA20+5 根；刻意不取 65，以便回测样本贴合分析口径
      holding: 5

  # ---- 归一化超跌（尺度无关的 MA60 族条件，来源：docs/归一化特征信号研究.md）----
  # 同一脚本登记 3 个阈值档，便于一次回测横向对比"严格 vs 放宽"的差异
  - name: norm_oversold_q1
    enabled: true
    script: strategies/norm_oversold.py
    params:
      r_ma5_ma60_max: 0.9058  # MA5/MA60 的 Q1 上界（严）
      r_ma60_max: 0.8995      # close/MA60 的 Q1 上界（严）
      use_ma5_ma60: true
      use_ma60: true
      exclude_st: true
      exclude_boards: "68"    # 科创板整体：sh.688* 之外还有 689*（CDR，如 sh.689009）
      min_listed_days: 180
      min_bars: 60
      holding: 5

  - name: norm_oversold_q2
    enabled: true
    script: strategies/norm_oversold.py
    params:
      r_ma5_ma60_max: 0.9575  # 放宽到 Q2 上界
      r_ma60_max: 0.9543
      use_ma5_ma60: true
      use_ma60: true
      exclude_st: true
      exclude_boards: "68"    # 科创板整体（含 689 CDR）
      min_listed_days: 180
      min_bars: 60
      holding: 5

  - name: norm_oversold_q1_slope
    enabled: true
    script: strategies/norm_oversold.py
    params:
      r_ma5_ma60_max: 0.9058  # Q1 严档 + 叠加 MA20 快速下滑
      r_ma60_max: 0.8995
      slope_ma20_5_max: -2.1382
      use_ma5_ma60: true
      use_ma60: true
      exclude_st: true
      exclude_boards: "68"    # 科创板整体（含 689 CDR）
      min_listed_days: 180
      min_bars: 60
      holding: 5

  # ---- b1_oversold 的升级版：并入归一化超跌门槛（不改动 b1_oversold 本身）----
  # 归一化条件补的是 b1 缺失的"中期位置"维度；研究报告显示它不适合单独成策略
  # （组合口径为负），更适合做正交过滤器。阈值务必用 Q1 档（Q2 已实测失效）。
  - name: b1_oversold_norm
    enabled: true
    script: strategies/b1_oversold_norm.py
    params:
      # ---- 归一化超跌门槛（Q1 档）----
      r_ma5_ma60_max: 0.9058
      r_ma60_max: 0.8995
      use_ma5_ma60: true
      use_ma60: true
      # ---- 以下为 b1_oversold 原有参数 ----
      rsi_period: 6
      rsi_max: 20.0
      amp_min: 8.0
      amp_canbuy: 1.0
      price_min: 20.0
      lu_window: 20
      rmax_window: 60
      zt_main: 1.095
      zt_gem: 1.195
      boards: "60,00,30"      # 白名单：已天然排除科创板（含 689 CDR）
      exclude_st: true
      min_listed_bars: 250
      require_market_down: true
      market_index: "399317"
      min_bars: 65
      holding: 5

  - name: b1_oversold_norm_slope
    enabled: true
    script: strategies/b1_oversold_norm.py
    params:
      # ---- 归一化超跌门槛（Q1 档 + MA20 快速下滑）----
      r_ma5_ma60_max: 0.9058
      r_ma60_max: 0.8995
      slope_ma20_5_max: -2.1382
      use_ma5_ma60: true
      use_ma60: true
      # ---- b1_oversold 原有参数 ----
      rsi_period: 6
      rsi_max: 20.0
      amp_min: 8.0
      amp_canbuy: 1.0
      price_min: 20.0
      lu_window: 20
      rmax_window: 60
      zt_main: 1.095
      zt_gem: 1.195
      boards: "60,00,30"
      exclude_st: true
      min_listed_bars: 250
      require_market_down: true
      market_index: "399317"
      min_bars: 65
      holding: 5
