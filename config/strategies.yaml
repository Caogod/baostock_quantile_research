# 策略注册表：每条目对应一个策略脚本。
# 新增策略：在 strategies/ 下新建脚本（定义 Strategy 类，继承 base.BaseStrategy），
# 然后在此登记 name / script / params 即可，无需改动引擎代码。
strategies:
  - name: ma_golden_cross
    enabled: false
    script: strategies/ma_golden_cross.py
    params:
      short: 5
      long: 20
      vol_ratio: 1.2
      holding: 5

  - name: volume_breakout
    enabled: true
    script: strategies/volume_breakout.py
    params:
      n: 20
      vol_ratio: 1.5
      holding: 5

  # ---- 分位筛选（基础）----
  - name: quantile_range
    enabled: false
    script: strategies/quantile_range.py
    params:
      window: 60
      quantile_low: 0.25
      quantile_high: 0.50
      holding: 5

  # ---- 分位筛选 + 均线（在 quantile_range 基础上进一步判断）----
  - name: quantile_ma
    enabled: false
    script: strategies/quantile_ma.py
    params:
      window: 60
      quantile_low: 0.25
      quantile_high: 0.50
      ma_short: 5
      ma_long: 20
      holding: 5

  # ---- 分位筛选 + 量能 t 检验（在 quantile_range 基础上判断量能显著放大）----
  - name: quantile_volume
    enabled: false
    script: strategies/quantile_volume.py
    params:
      window: 60
      recent_days: 10
      significance: 0.01
      quantile_low: 0.25
      quantile_high: 0.50
      holding: 5

  # ---- 均线粘合 + 放量突破 ----
  - name: ma_breakout
    enabled: false
    script: strategies/ma_breakout.py
    params:
      ma_short: 5
      ma_mid: 10
      ma_long: 20
      converge_pct: 0.03
      breakout_pct: 0.05
      min_turn: 10.0
      holding: 5

  # ---- ma_breakout 信号延迟5日入场（对比用）----
  - name: ma_breakout_shift5
    enabled: true
    script: strategies/ma_breakout_shift.py
    params:
      shift: 5
      ma_short: 5
      ma_mid: 10
      ma_long: 20
      converge_pct: 0.03
      breakout_pct: 0.05
      min_turn: 10.0
      holding: 5

  # ---- B1 稳健超跌型（同花顺远航版公式移植）----
  - name: b1_oversold
    enabled: true
    script: strategies/b1_oversold.py
    params:
      rsi_period: 6
      rsi_max: 20.0
      amp_min: 8.0          # CORE1 当日振幅下限(%)
      amp_canbuy: 1.0       # CANBUY 当日振幅下限(%)
      price_min: 20.0       # 收盘价下限（<=0 不启用）；用当前复权价
      lu_window: 20         # 近 N 日无涨停
      rmax_window: 60       # RMAX 窗口（排除 5% 涨跌幅限制的 ST 股）
      zt_main: 1.095
      zt_gem: 1.195
      boards: "60,00,30"    # 仅主板/创业板，排除科创北交
      exclude_st: true
      min_listed_bars: 250  # 上市满 N 个交易日（0 不校验）
      require_market_down: true
      market_index: "399317"
      min_bars: 65
      holding: 5

  # ---- 均线单次金叉突破 + 低波动 + 动量爆发 ----
  - name: ma_cross_breakout
    enabled: false
    script: strategies/ma_cross_breakout.py
    params:
      lookback: 80
      surge_days: 2
      surge_pct: 0.05
      turn_ma: 10
      turn_ratio: 1.3
      boll_ma: 20
      boll_k: 3.0
      vol_ratio_max: 0.26
      # 波动窗口前用 MA5 连续下降修剪：跳过窗口头部下跌段，从停止下降处起算波动率
      trim_decline: true
      min_vol_days: 10
      cross_ma_short: 5
      cross_ma_mid: 10
      cross_ma_long: 20
      cross_ma_base: 60
      holding: 5
